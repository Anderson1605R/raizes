spring.application.name=raizes

#  Configuração de Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/raizesdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Exibir os comandos SQL no terminal (Ajuda a ver se a tabela foi criada)
spring.jpa.show-sql=true

# Forçar a criação das tabelas lendo as classes Java com o @Entity
spring.jpa.hibernate.ddl-auto=update

# Dialeto do PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações para ler o arquivo data.sql corretamente
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8